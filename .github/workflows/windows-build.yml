name: Windows PWA build compatibility

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test nesting engine and unit conversions
        run: node --test tests/nesting.test.cjs tests/nesting-ui.test.cjs tests/material-bindings.test.cjs
      - name: Build Windows-compatible installable PWA assets
        run: python build.py
      - name: Verify generated PWA and offline cache boundaries
        run: node scripts/verify-build.cjs
