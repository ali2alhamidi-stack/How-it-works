name: Verify application

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Node.js 24
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Test domain rules, HTTP server, permissions and synchronization
        run: node --test tests/*.test.cjs
      - name: Build the central PWA and standalone demo
        run: python3 build.py
      - name: Verify assets, installation metadata and private API cache boundary
        run: node scripts/verify-build.cjs
      - name: Require generated files to match source
        run: git diff --exit-code -- public/
      - name: Upload reviewable interface build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: work-orders-interface-${{ github.sha }}
          path: |
            public/
            index.html
            docs/USER-GUIDE.md
            README.md
          if-no-files-found: error
          retention-days: 14
