name: Rebuild refined UI assets (temporary)
on:
  push:
    branches:
      - feat/awamer-refined-ui-20261120
permissions:
  contents: write
jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify refined source before building
        run: node --test tests/refined-ui.test.cjs
      - name: Build the central PWA and self-contained demonstration
        run: python3 build.py
      - name: Verify generated files and login resources
        run: node scripts/verify-build.cjs
      - name: Commit compiled assets to the same feature branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'Awamer UI Builder'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A public/
          if git diff --cached --quiet; then
            echo "Generated files already match source."
            exit 0
          fi
          git commit -m 'build: regenerate refined Awamer UI bundles'
          git push origin HEAD:feat/awamer-refined-ui-20261120
