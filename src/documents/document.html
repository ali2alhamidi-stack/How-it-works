<!doctype html><html lang="ar" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#153c49">
<title>مستند أوامر التفاعلي</title><link rel="stylesheet" href="/document.css">
<script defer src="/document-qr.js"></script><script defer src="/document-renderer.js"></script><script defer src="/document-page.js"></script></head>
<body><div id="root"><main class="doc-frame" dir="rtl"><h1>جار تحميل المستند...</h1></main></div>
<div class="doc-modal" id="sign-modal" hidden role="dialog" aria-modal="true" aria-labelledby="sign-title">
 <section class="doc-modal-card"><h2 id="sign-title">اعتماد وتوقيع العرض</h2>
  <p>تأكد من المقاسات والكمية والباقة؛ يسجل اعتمادك على الإصدار الحالي.</p>
  <label for="sign-name">اسم المعتمد</label><input id="sign-name" type="text" maxlength="120" required autocomplete="name">
  <label for="sign-canvas">التوقيع داخل المساحة</label><canvas class="doc-canvas" id="sign-canvas" width="440" height="190" aria-label="مساحة التوقيع بالقلم أو الإصبع"></canvas>
  <label><input type="checkbox" id="sign-consent"> أوافق على الشروط المبينة في مستند العرض</label>
  <div class="doc-error" id="sign-error" hidden></div>
  <div class="doc-modal-buttons"><button type="button" class="doc-cta" id="sign-confirm">تأكيد واعتماد</button>
  <button type="button" class="doc-btn" id="sign-clear">مسح التوقيع</button><button type="button" class="doc-btn" data-modal-close>إلغاء</button></div>
 </section>
</div>
<div class="doc-modal" id="receipt-modal" hidden role="dialog" aria-modal="true" aria-labelledby="receipt-title">
 <section class="doc-modal-card"><h2 id="receipt-title">إرفاق إشعار التحويل</h2>
  <p>الإيصال مجرد إثبات مقدم للمراجعة، ولا يؤكد وصول المبلغ أو يصدر سند قبض محاسبي.</p>
  <label for="receipt-file">صورة إشعار التحويل</label><input id="receipt-file" type="file" accept="image/png,image/jpeg,image/webp">
  <label for="receipt-amount">المبلغ المدعى تحويله</label><input type="number" min="0" step="0.01" id="receipt-amount">
  <div class="doc-error" id="receipt-error" hidden></div><div class="doc-modal-buttons">
   <button type="button" class="doc-cta" id="receipt-confirm">إرسال الإيصال للمراجعة</button>
   <button type="button" class="doc-btn" data-modal-close>إلغاء</button>
  </div>
 </section>
</div>
<div class="doc-modal" id="zoom-modal" hidden role="dialog" aria-modal="true" aria-label="معاينة التصميم">
 <button type="button" class="doc-btn" data-modal-close style="position:absolute;top:15px;left:15px">إغلاق الصورة</button><img id="zoom-photo" class="doc-img-zoom" alt="معاينة مكبرة">
</div>
<div id="page-alert" role="status" aria-live="polite" style="position:fixed;top:8px;left:8px;z-index:85;max-width:380px"></div>
</body></html>
