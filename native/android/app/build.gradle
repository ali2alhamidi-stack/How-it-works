plugins { id 'com.android.application' }
android {
    namespace 'tech.qodynex.awamer'
    compileSdk 35
    defaultConfig {
        applicationId 'tech.qodynex.awamer'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '2.1.0'
    }
    signingConfigs {
        production {
            def keyfile = System.getenv('AWAMER_KEYSTORE_FILE')
            if (keyfile) {
                storeFile file(keyfile)
                storePassword System.getenv('AWAMER_KEYSTORE_PASSWORD')
                keyAlias System.getenv('AWAMER_KEY_ALIAS')
                keyPassword System.getenv('AWAMER_KEY_PASSWORD')
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if (System.getenv('AWAMER_KEYSTORE_FILE')) signingConfig signingConfigs.production
        }
        debug { debuggable true }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
