name: work-orders
services:
  app:
    image: work-orders-app:local
    build:
      context: .
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24.22.3-bookworm-slim}
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      DB_PATH: /data/work-orders.sqlite
      PUBLIC_DIR: /app/public
      APP_ORIGIN: https://${DOMAIN:?Set DOMAIN to the real public hostname}
      SECURE_COOKIES: "true"
      SESSION_HOURS: ${SESSION_HOURS:-12}
      # The app is not published; only the controlled Caddy proxy can reach it.
      TRUST_PROXY: "true"
    volumes:
      - app_data:/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    networks:
      - backend
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/session').then(r=>{if(r.status!==401)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    stop_grace_period: 20s
  caddy:
    image: ${CADDY_IMAGE:-caddy:2-alpine}
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to the real public hostname}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL for certificate notifications}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - edge
      - backend
volumes:
  app_data:
  caddy_data:
  caddy_config:
networks:
  edge:
  backend:
    internal: true
